services:
  investment-assistant:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      APP_DATABASE_PATH: /app/data/investment-assistant.db
      APP_TELEGRAM_ENABLED: "${APP_TELEGRAM_ENABLED:-false}"
      APP_TELEGRAM_SESSION_PATH: /app/data/telegram
      APP_TELEGRAM_HISTORY_LIMIT: "${APP_TELEGRAM_HISTORY_LIMIT:-100}"
      APP_TELEGRAM_AUTH_MODE: "${APP_TELEGRAM_AUTH_MODE:-RUNTIME}"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-0}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
      TELEGRAM_PHONE: "${TELEGRAM_PHONE:-}"
      APP_OPENAI_ENABLED: "false"
      APP_IBKR_ENABLED: "false"
      APP_MARKET_DATA_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
